# 4G/2G هي قيمة قالب Flutter المُتحقَّق منها. الـ 8G/4G السابقة كانت تطلب
# ~12GB لكل daemon، فيموت الـ daemon على الأجهزة الأقل ويقوم Gradle بآخر
# مكانه — وتتزاحم النسخ على قفل الـ build logic.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# ميزتان اختياريتان جديدتان في AGP 9.x — يعطّلهما قالب Flutter الحالي
# (flutter create) صراحة أيضاً، فتبقى هذه أدق قيمة مُتحقَّق منها للتوافق مع
# Flutter Gradle Plugin الحالي، لا افتراضاً بلا مصدر.
android.newDsl=false
android.builtInKotlin=false

# AGP يحاول تنزيل ما ينقص من حزم SDK وقت الإعداد عبر sdkmanager. وsdkmanager
# مهجور الآن ويُحوَّل إلى Android CLI الجديدة، وهي تقرأ `ndk;28.2.13676358`
# كحزمتين منفصلتين ثم تنهار (NTSTATUS 0xC0000409) — فيموت كل بناء قبل أن
# تبدأ أي مهمة. تعطيل التنزيل التلقائي يقطع هذا المسار المكسور.
#
# ولا شيء يُفقد: التنزيل التلقائي كماليّ، والحزم الناقصة تُثبَّت من SDK
# Manager. أما نسخة NDK المطلوبة هنا فيضعها Flutter Gradle Plugin تلقائياً من
# أعلى نسخة تطلبها الإضافات، لا هذا المشروع — ولا كود native على أندرويد فيه
# يستهلكها أصلاً.
android.builder.sdkDownload=false

# نسخة أدوات البناء لكل وحدات أندرويد. تُقرأ في android/build.gradle.kts
# وتُطبَّق على التطبيق وعلى كل إضافة — مصدر واحد لا رقم مكرَّر في ملفين.
# يجب أن تبقى مطابقة لمجلد مثبَّت من SDK Manager تحت sdk/build-tools.
drd.buildToolsVersion=36.1.0

# الترجمة التزايدية لـ Kotlin معطَّلة عمداً.
#
# تخزّن هذه الترجمة مسارات المصادر **نسبةً** إلى جذر المشروع عبر
# RelocatableFileToPathConverter. وعلى ويندوز لا مسار نسبي بين قرصين: مشروع
# على E: وكاش حزم pub على C:\Users\…\AppData\Local\Pub\Cache يجعل
# File.relativeTo يرمي "this and base files have different roots"، فيفشل
# البناء عند إغلاق الكاش — لا عند الترجمة نفسها، ومصادر الإضافة سليمة تماماً.
#
# الثمن: كل ترجمة Kotlin تبدأ من الصفر، فتبطؤ البناءات التالية قليلاً. وهو
# ثمن مقبول: وحدات Kotlin هنا هي الإضافات وحدها، ولا تتغيّر بين البناءات.
#
# البديل الوحيد هو وضع المشروع وكاش pub على القرص نفسه — وهو قرار بيئة على
# كل جهاز، لا شيء يضمنه المستودع.
kotlin.incremental=false
