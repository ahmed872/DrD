name: medical_appointment_app
description: A Medical Appointment System for local villages.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.0.0
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  intl: ^0.20.2
  url_launcher: ^6.2.0
  shared_preferences: ^2.2.0
  cloud_functions: ^6.4.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png

  # Cairo: خطّ عربي مصمَّم لواجهات الشاشات، بحروف لاتينية وأرقام من نفس
  # العائلة — فلا يختلف شكل «د. سلمى» عن شكل «09:00» في السطر نفسه.
  # كل ملف يدمج المجموعتين العربية واللاتينية في وجه واحد (نحو 72 ك.ب).
  # قبل هذا لم يكن للتطبيق خطّ معرَّف إطلاقاً: كان يقع على خط النظام
  # الافتراضي، وهو ما يجعل أي تطبيق Flutter يبدو قالباً عاماً.
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-400.ttf
          weight: 400
        - asset: assets/fonts/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700
