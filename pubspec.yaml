name: medical_appointment_app
description: A Medical Appointment System for local villages.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.0.0
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  intl: ^0.20.2
  url_launcher: ^6.2.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png

  # الخط العربي مُضمَّن مع التطبيق عمداً.
  #
  # بدونه ينزّل CanvasKit خط احتياط عربياً من gstatic.com وقت التشغيل: يختلف
  # شكل النص بين جهاز وآخر، ويظهر التطبيق بخط مكسور خلف الشبكات التي تحجب
  # gstatic — وهي الحالة نفسها التي بُني لها `--no-web-resources-cdn`.
  #
  # ثلاثة أوزان فقط (‏‎265 ك.ب مجتمعة): Flutter يختار أقرب وزن متاح، فتغطّي
  # هذه الأوزان الثلاثة السُلّم كاملاً دون تضخيم حجم التحميل الأول.
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
