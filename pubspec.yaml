name: medical_appointment_app
description: A Medical Appointment System for local villages.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.0.0
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  intl: ^0.20.2
  url_launcher: ^6.2.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png

  # خط الواجهة. مُضمَّن في التطبيق ولا يُحمَّل من الشبكة: تطبيق طبي يجب أن
  # يعمل بلا إنترنت مستقر، وتحميل الخط وقت التشغيل يعني وميض نصّ بخط بديل
  # في كل إقلاع — أو نصّاً غير مقروء إن تعذّر التحميل. ولا يُرسَل أي طلب
  # إلى خوادم خارجية من شاشة تحمل بيانات مرضى.
  #
  # IBM Plex Sans Arabic — رخصة SIL OFL 1.1 (assets/fonts/OFL.txt).
  # اختير على غيره لأن أرقامه العربية والهندية واضحة في المقاسات الصغيرة،
  # وهو ما يهمّ هنا: أوقات المواعيد والأسعار والتقييمات كلها أرقام.
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
